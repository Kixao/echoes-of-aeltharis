<circle cx="311" cy="175" r="7" fill="url(#v7-spark-fill)" opacity=".7"/><circle class="ember-core" cx="311" cy="175" r="2.5" fill="#fcf6ff"/>
<circle class="ember-core" cx="436" cy="246" r="2" fill="#8adfff"/><circle class="ember-core" cx="357" cy="324" r="1.7" fill="#dcb6ff"/><circle cx="337" cy="217" r="1.1" fill="#f0ffff"/>
</g>
<g class="ember-track" style="--speed:9.1s;--pulse:2.1s">
<path class="ember-trail" d="M407 300 Q422 296 428 285" fill="none" stroke="#8adfff" stroke-width="1.6" opacity=".6"/>
<circle cx="428" cy="285" r="7.5" fill="url(#v7-spark-fill)" opacity=".7"/><circle class="ember-core" cx="428" cy="285" r="2.4" fill="#f0ffff"/>
<circle class="ember-core" cx="271" cy="231" r="1.9" fill="#d7bbff"/><circle class="ember-core" cx="367" cy="186" r="1.6" fill="#a3ebff"/><circle cx="398" cy="225" r="1.2" fill="#fff"/>
</g>
<g class="ember-track reverse" style="--speed:4.6s;--pulse:1.5s">
<path class="ember-trail" d="M292 281 Q303 287 315 291" fill="none" stroke="#93ccff" stroke-width="1.5" opacity=".62"/>
<circle cx="315" cy="291" r="7" fill="url(#v7-spark-fill)" opacity=".55"/><circle class="ember-core" cx="315" cy="291" r="2.4" fill="#f0faff"/>
<circle class="ember-core" cx="412" cy="164" r="1.8" fill="#eed2ff"/><circle class="ember-core" cx="383" cy="259" r="1.6" fill="#f0ffff"/><circle cx="352" cy="274" r="1.3" fill="#a3baff"/>
</g>
<g class="ember-track" style="--speed:11.4s;--pulse:2.25s">
<circle cx="357" cy="126" r="6" fill="url(#v7-spark-fill)" opacity=".38"/><circle class="ember-core" cx="357" cy="126" r="1.6" fill="#e4d5ff"/>
<circle class="ember-core" cx="464" cy="226" r="1.9" fill="#b1f7ff"/><circle class="ember-core" cx="285" cy="205" r="1.3" fill="#fff"/><circle class="ember-core" cx="350" cy="310" r="1.8" fill="#afbbff"/>
</g>
<circle cx="360" cy="232" r="57" fill="url(#v7-vortex)" opacity=".75"/>
<g fill="#ecf9ff"><circle cx="303" cy="207" r="3"/><circle cx="419" cy="257" r="4"/><circle cx="366" cy="157" r="2.5"/><circle cx="315" cy="295" r="2.5"/><circle cx="390" cy="302" r="3"/></g>
</g>
<!-- Orb body: show only completely seamless version at rest -->
<g class="float">
<!-- Split masks extend beyond BOTH jewel tips. The original mask ended at y=362, cutting off the bottom crystal (to y=383).
     Only rendered when opening begins, never during the intact fracture phase. -->
<g class="pieces">
  <g class="piece-left" clip-path="url(#v7-left-clip)"><use href="#v7-complete-frame"/></g>
  <g class="piece-right" clip-path="url(#v7-right-clip)"><use href="#v7-complete-frame"/></g>
</g>
<!-- All phases before OPENING use this very same full frame, preserving both crystals. -->
<g class="pristine"><use href="#v7-complete-frame"/></g>
<!-- Glowing fracture draws across the visible full crystals before the halves part. -->
<g class="fractures" stroke="#f2fcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"><use href="#v7-fracture-path"/><path d="M351 180 L315 165 L293 183 M348 232 L304 246 L278 236 M371 265 L414 247 L438 264 M370 312 L413 333 L440 321" stroke-width="2.5"/></g>
</g>
<!-- Explosion effect; these layers do not exist visually until cracking -->
<g class="charge-circle"><circle cx="360" cy="232" r="151" fill="none" stroke="#d7c8ff" stroke-width="4" stroke-dasharray="30 13" filter="url(#v7-blur-s)"/></g>
<g class="pillar"><path d="M336 411 L289 2 H431 L384 411Z" fill="url(#v7-pillar)"/><path d="M349 410 L337 45 H383 L371 410Z" fill="url(#v7-pillar)" opacity=".75"/></g>
<g class="rays" stroke-linecap="round" filter="url(#v7-blur-s)"><path d="M360 222 V79 M360 242 V726 M348 232 H170 M372 232 H552 M350 222 L224 96 M370 242 L498 372 M370 222 L497 99 M350 242 L224 374" stroke="#d9faff" stroke-width="11"/><path d="M355 220 L295 65 M365 245 L421 399 M346 234 L186 293 M375 222 L527 168 M348 219 L283 146 M376 242 L445 319" stroke="#a883ff" stroke-width="7"/></g>
<circle class="shockwave one" cx="360" cy="232" r="83" fill="none" stroke="#e1dbff" stroke-width="8"/><circle class="shockwave two" cx="360" cy="232" r="92" fill="none" stroke="#81dfff" stroke-width="8"/>
<g class="sparks"><use href="#v7-star" transform="translate(261 126) scale(1.4)"/><use href="#v7-star" transform="translate(463 122) scale(1.1)"/><use href="#v7-star" transform="translate(536 214) scale(.9)"/><use href="#v7-star" transform="translate(194 255) scale(1.1)"/><use href="#v7-star" transform="translate(303 352) scale(1.2)"/><use href="#v7-star" transform="translate(435 344) scale(1.1)"/><circle cx="310" cy="159" r="5" fill="#c2a7ff"/><circle cx="448" cy="288" r="5" fill="#b5f1ff"/><circle cx="267" cy="303" r="4" fill="#fff"/><circle cx="413" cy="132" r="4" fill="#fff"/></g>
<g class="flash"><circle cx="360" cy="232" r="100" fill="url(#v7-flash)"/><circle cx="360" cy="232" r="55" fill="#f4ffff" opacity=".7" filter="url(#v7-blur)"/></g>
</svg>
