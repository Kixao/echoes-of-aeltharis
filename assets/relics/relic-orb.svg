<path d="M249 166 Q285 133 327 158 M471 166 Q435 133 393 158 M255 310 Q296 351 332 326 M465 310 Q424 351 388 326" fill="none" stroke="#f1d9a4" stroke-width="2.5" opacity=".76"/>


<path d="M230 232 L246 216 L262 232 L246 248Z M490 232 L474 216 L458 232 L474 248Z" fill="#202452" stroke="url(#v7-metal)" stroke-width="5"/><path d="M235 232 L246 221 L256 232 L246 243Z M485 232 L474 221 L464 232 L474 243Z" fill="url(#v7-gem)"/>
