<path class="ember-trail" d="M412 180 Q421 191 419 205" fill="none" stroke="#b8faff" stroke-width="1.8" opacity=".7"/>
<circle cx="419" cy="205" r="8" fill="url(#v7-spark-fill)" opacity=".6"/><circle class="ember-core" cx="419" cy="205" r="2.6" fill="#f3ffff"/>
<circle class="ember-core" cx="303" cy="255" r="1.7" fill="#91dfff"/><circle class="ember-core" cx="353" cy="151" r="1.4" fill="#f6ddff"/><circle cx="400" cy="299" r="1.3" fill="#ccefff"/>
</g>
