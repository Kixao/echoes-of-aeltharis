<g class="ambient-bloom" pointer-events="none">
<circle class="bloom-aura" cx="360" cy="232" r="189" fill="url(#v7-outer-bloom)" filter="url(#v7-blur)" opacity=".75"/>
<circle class="bloom-edge" cx="360" cy="232" r="143" fill="none" stroke="#a6b5ff" stroke-width="8" opacity=".38" filter="url(#v7-blur)"/>
<ellipse cx="360" cy="393" rx="113" ry="15" fill="#bcb0ff" opacity=".38" filter="url(#v7-blur)"/>
</g>
<!-- Magic within the sealed orb -->
<g class="arcane" clip-path="url(#v7-magic-clip)">
<circle class="aura" cx="360" cy="232" r="150" fill="url(#v7-vortex)" filter="url(#v7-blur)" opacity=".8"/>
<circle cx="360" cy="232" r="128" fill="#171c4c" opacity=".32"/>
<circle class="inner-bloom" cx="360" cy="232" r="118" fill="url(#v7-inner-bloom)" opacity=".75"/>
<ellipse class="aether-nucleus" cx="360" cy="232" rx="72" ry="66" fill="url(#v7-nucleus)" opacity=".66"/>
<g class="vortex" fill="none" stroke-linecap="round"><ellipse cx="360" cy="232" rx="109" ry="43" transform="rotate(-26 360 232)" stroke="#b4f9ff" stroke-width="11" opacity=".34" filter="url(#v7-blur-s)"/><ellipse cx="360" cy="232" rx="105" ry="47" transform="rotate(32 360 232)" stroke="#8d6dff" stroke-width="12" opacity=".6" filter="url(#v7-blur-s)"/><path class="stream" d="M259 247 C302 138 419 160 456 236 S393 339 314 293 S294 179 375 185 S431 271 350 278" stroke="#a9ecff" stroke-width="6.5" stroke-dasharray="72 17 48 20" opacity=".9"/><path class="stream" d="M273 199 C301 308 413 326 444 223 S359 146 309 206 S368 317 407 255" stroke="#dfb1ff" stroke-width="5" stroke-dasharray="50 20 35 20" opacity=".85"/><path class="stream" d="M299 274 Q380 107 430 225 T322 301" stroke="#f4ffff" stroke-width="2.5" stroke-dasharray="18 16" opacity=".8"/></g>
<g class="vortex reverse" fill="none"><ellipse cx="360" cy="232" rx="85" ry="28" transform="rotate(65 360 232)" stroke="#a88dff" stroke-width="4" stroke-dasharray="46 18" opacity=".67"/><ellipse cx="360" cy="232" rx="94" ry="23" transform="rotate(-55 360 232)" stroke="#b5ebff" stroke-width="3" stroke-dasharray="25 19" opacity=".8"/></g>
<g class="vortex inner-threads" fill="none" stroke-linecap="round"><path d="M312 237 Q345 184 397 209 T407 275 Q365 315 326 259" stroke="#d5ffff" stroke-width="2" opacity=".7" stroke-dasharray="21 12 32 16"/><path d="M317 197 Q380 275 417 217 Q399 177 356 183" stroke="#dfc0ff" stroke-width="2.1" opacity=".7" stroke-dasharray="22 13"/></g>
