<g fill="#a8b8c8" stroke="#273249" stroke-width="1.7"><circle cx="238" cy="423" r="4.7"/><circle cx="482" cy="423" r="4.7"/><circle cx="279" cy="447" r="3.8"/><circle cx="441" cy="447" r="3.8"/><circle cx="322" cy="458" r="3"/><circle cx="398" cy="458" r="3"/></g>
<g stroke="#28344a" stroke-width="1.1"><path d="M235 423 H241 M479 423 H485 M276 447 H282 M438 447 H444"/></g>
<ellipse cx="360" cy="390" rx="104" ry="12" fill="#a39dff" opacity=".2" filter="url(#v7-blur)"/>
