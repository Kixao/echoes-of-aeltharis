<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A sealed magical orb containing luminous swirling energy, brighter aether bloom, and tiny orbiting sparks, above a forged steel pedestal. Activate Crack Relic to fracture the sphere and release a brilliant burst of magic.">
<defs>
<radialGradient id="v7-shell" cx=".27" cy=".22" r=".95"><stop stop-color="#adddff" stop-opacity=".29"/><stop offset=".4" stop-color="#5e69b0" stop-opacity=".20"/><stop offset=".8" stop-color="#181f4b" stop-opacity=".64"/><stop offset="1" stop-color="#121632" stop-opacity=".92"/></radialGradient>
<radialGradient id="v7-vortex"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".12" stop-color="#d8ddff" stop-opacity=".9"/><stop offset=".33" stop-color="#8b62ff" stop-opacity=".72"/><stop offset=".7" stop-color="#493bac" stop-opacity=".31"/><stop offset="1" stop-color="#302e85" stop-opacity="0"/></radialGradient>
<radialGradient id="v7-flash"><stop stop-color="#fff"/><stop offset=".13" stop-color="#f8f9ff"/><stop offset=".35" stop-color="#bcf5ff" stop-opacity=".9"/><stop offset=".65" stop-color="#9d78ff" stop-opacity=".54"/><stop offset="1" stop-color="#ad77ff" stop-opacity="0"/></radialGradient>
<linearGradient id="v7-metal"><stop stop-color="#8b653b"/><stop offset=".23" stop-color="#f9dfa2"/><stop offset=".46" stop-color="#b47e4b"/><stop offset=".73" stop-color="#ffedc2"/><stop offset="1" stop-color="#765135"/></linearGradient>
<linearGradient id="v7-gem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3ffff"/><stop offset=".4" stop-color="#96a7ff"/><stop offset=".75" stop-color="#a45efa"/><stop offset="1" stop-color="#503a9b"/></linearGradient>
<linearGradient id="v7-plinth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#555274"/><stop offset=".35" stop-color="#282940"/><stop offset="1" stop-color="#141729"/></linearGradient>
<linearGradient id="v7-pillar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#d7eaff" stop-opacity=".9"/><stop offset=".45" stop-color="#a883ff" stop-opacity=".35"/><stop offset="1" stop-color="#c5aaff" stop-opacity="0"/></linearGradient>

<linearGradient id="v7-blued-steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8cde2"/><stop offset=".13" stop-color="#60748c"/><stop offset=".34" stop-color="#313f58"/><stop offset=".63" stop-color="#20293e"/><stop offset="1" stop-color="#131929"/></linearGradient>
<linearGradient id="v7-face-steel" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#141d30"/><stop offset=".21" stop-color="#536984"/><stop offset=".47" stop-color="#263349"/><stop offset=".7" stop-color="#667b92"/><stop offset="1" stop-color="#141b2a"/></linearGradient>
<linearGradient id="v7-edge-steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f6ff"/><stop offset=".2" stop-color="#9fb5c7"/><stop offset=".58" stop-color="#43536a"/><stop offset="1" stop-color="#a7bfd3"/></linearGradient>
<radialGradient id="v7-spark-fill"><stop stop-color="#fff"/><stop offset=".2" stop-color="#e8faff"/><stop offset=".45" stop-color="#b0e0ff" stop-opacity=".7"/><stop offset="1" stop-color="#a58aff" stop-opacity="0"/></radialGradient>
<radialGradient id="v7-outer-bloom"><stop stop-color="#d5f8ff" stop-opacity=".69"/><stop offset=".28" stop-color="#9fbdff" stop-opacity=".46"/><stop offset=".57" stop-color="#946dff" stop-opacity=".25"/><stop offset="1" stop-color="#7654ff" stop-opacity="0"/></radialGradient>
<radialGradient id="v7-inner-bloom"><stop stop-color="#faffff" stop-opacity=".88"/><stop offset=".16" stop-color="#c9f5ff" stop-opacity=".68"/><stop offset=".45" stop-color="#9da6ff" stop-opacity=".40"/><stop offset=".78" stop-color="#8b64f9" stop-opacity=".12"/><stop offset="1" stop-color="#986cfa" stop-opacity="0"/></radialGradient>
<radialGradient id="v7-nucleus"><stop stop-color="#fff" stop-opacity=".92"/><stop offset=".26" stop-color="#b9f7ff" stop-opacity=".63"/><stop offset=".65" stop-color="#b68dff" stop-opacity=".24"/><stop offset="1" stop-color="#8161ed" stop-opacity="0"/></radialGradient>
<filter id="v7-blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="v7-blur-s" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
