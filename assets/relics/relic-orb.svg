<!-- Identical source artwork for the intact orb and BOTH V3-style fractured shells.
     No geometry swap during charging or fracturing. -->
<g id="v7-complete-frame"><use href="#v7-frame"/><use href="#v7-upper-jewel"/><use href="#v7-lower-jewel"/></g>
</defs>
<!-- Quiet architectural backdrop: no decorative orbit rings -->
<g fill="none" stroke="#8295cd" stroke-width="8" opacity=".19"><path d="M81 400 V90 Q112 35 145 90 V700 M575 400 V90 Q609 35 640 90 V700"/><path d="M145 96 Q255 -34 360 99 Q467 -34 575 96"/></g>

