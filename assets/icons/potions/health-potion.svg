  <linearGradient id="hp-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3c4da" stop-opacity=".72"/><stop offset=".22" stop-color="#49566d" stop-opacity=".25"/><stop offset=".57" stop-color="#53677e" stop-opacity=".14"/><stop offset="1" stop-color="#cad1e3" stop-opacity=".64"/></linearGradient>
  <linearGradient id="hp-red" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#ffadb1"/><stop offset=".14" stop-color="#f45666"/><stop offset=".48" stop-color="#d91d42"/><stop offset=".8" stop-color="#931638"/><stop offset="1" stop-color="#530e2b"/></linearGradient>
