  <linearGradient id="hp-cork" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfb48c"/><stop offset=".5" stop-color="#946245"/><stop offset="1" stop-color="#664132"/></linearGradient>
  <filter id="hp-blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="hp-glass-clip"><path d="M52 37 L76 37 L80 45 C96 48 104 59 104 80 C104 104 89 117 64 117 C39 117 24 104 24 80 C24 59 32 48 48 45Z"/></clipPath>
